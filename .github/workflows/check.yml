name: Check FinalCut Parkas
on:
  schedule:
    - cron: '0 * * * *'   # every hour
  workflow_dispatch: {}    # lets you trigger it manually too

permissions:
  contents: write   # needed so the workflow can commit the updated site/state

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python3 check_parkas.py
      - name: Commit updated site and state
        run: |
          git config user.name "parka-bot"
          git config user.email "bot@example.com"
          git add seen_products.json docs/feed.json docs/index.html
          git diff --staged --quiet || git commit -m "update parka feed"
          git push